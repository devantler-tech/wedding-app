name: 🚀 CD
on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  publish:
    name: Publish
    permissions:
      contents: read # checkout
      packages: write # push image + manifests OCI artifact
      id-token: write # keyless cosign signing
    uses: devantler-tech/actions/.github/workflows/publish-app.yaml@9713532ad079498f12077b06b6cdf6e127f53773 # v9.0.10
    with:
      app-name: wedding-app
