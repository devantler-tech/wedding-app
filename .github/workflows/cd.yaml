name: 🚀 CD
on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  publish:
    name: Publish
    permissions:
      contents: read # checkout
      packages: write # push image + manifests OCI artifact
      id-token: write # keyless cosign signing
    uses: devantler-tech/reusable-workflows/.github/workflows/publish-app.yaml@c830916321473ec23bb612e41de963b9b01af897 # v5.6.6
    with:
      app-name: wedding-app
