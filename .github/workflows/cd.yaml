name: 🚀 CD
on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  publish:
    name: Publish
    permissions:
      contents: read # checkout
      packages: write # push image + manifests OCI artifact
      id-token: write # keyless cosign signing
    uses: devantler-tech/reusable-workflows/.github/workflows/publish-app.yaml@d3a8a00a579bdbe53703fc1b3f48c0cc04446661 # v5.6.4
    with:
      app-name: wedding-app
