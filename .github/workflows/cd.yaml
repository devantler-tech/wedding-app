name: 🚀 CD
on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  publish:
    name: Publish
    permissions:
      contents: read # checkout
      packages: write # push image + manifests OCI artifact
      id-token: write # keyless cosign signing
    uses: devantler-tech/actions/.github/workflows/publish-app.yaml@061b345a7351b0caf23055caea63ccd08b75e20e # v8.0.0
    with:
      app-name: wedding-app
