name: 🚀 CD
on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  publish:
    name: Publish
    permissions:
      contents: read # checkout
      packages: write # push image + manifests OCI artifact
      id-token: write # keyless cosign signing
    uses: devantler-tech/actions/.github/workflows/publish-app.yaml@5aa2657f976103d716f585266a0fa4e964594df2 # v9.0.0
    with:
      app-name: wedding-app
