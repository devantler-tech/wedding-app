name: ✅ CI
on:
  pull_request:
    branches: [main]
  # main is validated too, so a commit that reaches it outside a pull request still gets linted,
  # tested and built, and the default branch carries a real health signal (issue #342).
  push:
    branches: [main]

# On main each run is that commit's verification record, so it gets a run-unique group: a group holds
# one running plus one pending run, and a third push would cancel the pending one, leaving a commit
# whose checks never completed. Pull requests keep the ref-keyed group, so a superseded run cancels.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  validate-retired-links:
    name: Validate retired repository links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check documentation
        id: links
        uses: devantler-tech/.github/actions/validate-retired-repo-links@bd0035dd8f41fcf1459b878882b8897443f8dc59 # v4.9.4
        with:
          enabled: "true"
      - name: Require a complete scan
        env:
          VALIDATED: ${{ steps.links.outputs.validated }}
        run: test "$VALIDATED" = true
      - name: Prepare an isolated retired-link fixture
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture=$(mktemp -d "$RUNNER_TEMP/retired-link-fixture.XXXXXX")
          git archive HEAD | tar -x -C "$fixture"
          printf '\n[Retired-link fixture](https://github.com/devantler-tech/reusable-workflows)\n' >> "$fixture/README.md"
          echo "directory=$fixture" >> "$GITHUB_OUTPUT"
      - name: Reject the seeded retired link
        id: negative
        continue-on-error: true
        uses: devantler-tech/.github/actions/validate-retired-repo-links@bd0035dd8f41fcf1459b878882b8897443f8dc59 # v4.9.4
        with:
          enabled: "true"
          working-directory: ${{ steps.fixture.outputs.directory }}
      - name: Reject missing consumer configuration
        id: missing-config
        continue-on-error: true
        uses: devantler-tech/.github/actions/validate-retired-repo-links@bd0035dd8f41fcf1459b878882b8897443f8dc59 # v4.9.4
        with:
          enabled: "true"
          config-file: .github/missing-retired-repo-links.json
      - name: Require both negative controls to fail without success output
        if: always()
        env:
          LINK_OUTCOME: ${{ steps.negative.outcome }}
          LINK_VALIDATED: ${{ steps.negative.outputs.validated }}
          CONFIG_OUTCOME: ${{ steps.missing-config.outcome }}
          CONFIG_VALIDATED: ${{ steps.missing-config.outputs.validated }}
        run: |
          test "$LINK_OUTCOME" = failure
          test -z "$LINK_VALIDATED"
          test "$CONFIG_OUTCOME" = failure
          test -z "$CONFIG_VALIDATED"
      - name: Checkout the exact validator source for diagnostic verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devantler-tech/.github
          ref: bd0035dd8f41fcf1459b878882b8897443f8dc59 # v4.9.4
          path: .catalogue-fixture
          sparse-checkout: actions/validate-retired-repo-links
          persist-credentials: false
      - name: Verify consumer wiring and exact rejection diagnostics
        shell: bash
        env:
          GOWORK: "off"
          GOFLAGS: ""
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          go -C .catalogue-fixture/actions/validate-retired-repo-links build -mod=readonly -trimpath -o "$RUNNER_TEMP/retired-link-validator" .
          bash scripts/retired-repo-links.test.sh "$RUNNER_TEMP/retired-link-validator"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint

  check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          DEV_SKIP_AUTH: "true"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run bundlesize

  # Required boot-smoke (issue #153): the only REQUIRED lane that boots the real
  # adapter-node entrypoint (`node build/index.js`). e2e serves the build via
  # `vite preview` and Lighthouse is non-required, so without this a boot-dead
  # adapter build (like @sveltejs/adapter-node 5.5.5 in v1.14.1) merges green
  # and CrashLoops prod.
  boot-smoke:
    name: Boot Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run boot-smoke
        env:
          DEV_SKIP_AUTH: "true"

  # Non-required lane (issue #100): measures real Core Web Vitals on the built app.
  # Deliberately NOT in `ci-required-checks` below — budget misses are warn-only and
  # this job's red/green over ~10 runs is the flakiness signal we use to decide
  # whether it is stable enough to ever promote into the required gate.
  lighthouse:
    name: Lighthouse CI (non-required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lhci
        env:
          DEV_SKIP_AUTH: "true"

  # The portable pin contract ships from platform-tenant-template and is deliberately NOT
  # tenant-ignored, so it lands here on every sync — but nothing here ran it, so the SHA pins on the
  # three devantler-tech/actions callers (cd, release, template-sync) were unchecked in this tenant.
  # A caller reverting to a movable tag is the ordinary outcome of a hand edit or a bad merge, and it
  # is exactly what this guard refuses. The template's own scaffold contract already specifies this
  # wiring by name — a `workflow-caller-pins` job running the script, and required checks depending
  # on it — so this is that wiring, not a new convention. No npm install: the script is `sh` + `yq`,
  # both present on the runner.
  workflow-caller-pins:
    name: Workflow Caller Pins
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 📌 Validate reusable workflow caller pins
        run: sh scripts/workflow-caller-pin-contract.test.sh

  # Issue #324: the platform suppressed Kubescape C-0017 for this namespace on the promise that the app
  # would run with a read-only root filesystem. This keeps that flag and its declared /tmp scratch
  # mount from silently reverting. `sh` + `yq` only, like the pin contract above.
  readonly-rootfs:
    name: Read-only Root Filesystem
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🔒 Validate the app container's read-only root filesystem
        run: sh scripts/readonly-rootfs.test.sh

  # The platform deploys a release only when its publish-app.yaml revision is approved for this tenant.
  # A PR that moves the pin to an unapproved revision would ship a release the platform refuses, so the
  # template's check compares the base and head pins and fails the move here instead. An unchanged pin
  # passes without contacting the platform.
  publish-pin-approved:
    name: Publish Pin Approved
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 🧪 Test the publish pin check
        run: sh scripts/publish-pin-approved.test.sh
      - name: 📌 Refuse an unapproved publish-app pin
        env:
          # A pull request compares against its base; a push to main against the tip it replaced.
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
        run: |
          # An empty base would turn `git show ":path"` into an index read, comparing the head with
          # itself and passing without checking anything.
          if [ -z "${BASE_SHA}" ]; then
            echo "::error::No base commit to compare the publish-app pin against."
            exit 1
          fi
          # Run the check as it exists on the base branch: a PR must not be able to weaken the check
          # that judges it.
          git show "${BASE_SHA}:scripts/publish-pin-approved.sh" >"${RUNNER_TEMP}/publish-pin-approved.sh"
          git show "${BASE_SHA}:.github/workflows/cd.yaml" >"${RUNNER_TEMP}/base-cd.yaml"
          sh "${RUNNER_TEMP}/publish-pin-approved.sh" "${RUNNER_TEMP}/base-cd.yaml" .github/workflows/cd.yaml

  ci-required-checks:
    name: CI - Required Checks
    runs-on: ubuntu-latest
    needs: [lint, check, test, e2e, build, boot-smoke, workflow-caller-pins, readonly-rootfs, publish-pin-approved, validate-retired-links]
    permissions: {}
    if: ${{ always() }}
    steps:
      - name: 📊 Require all CI checks to pass
        uses: devantler-tech/.github/actions/aggregate-job-checks@4b00bd6698af033dc472b39a7e609173fe38dfb1 # v6.0.6
        with:
          job-results: >-
            ${{ needs.lint.result }}
            ${{ needs.check.result }}
            ${{ needs.test.result }}
            ${{ needs.e2e.result }}
            ${{ needs.build.result }}
            ${{ needs.boot-smoke.result }}
            ${{ needs.workflow-caller-pins.result }}
            ${{ needs.readonly-rootfs.result }}
            ${{ needs.publish-pin-approved.result }}
            ${{ needs.validate-retired-links.result }}
