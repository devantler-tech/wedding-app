name: ✅ CI
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          DEV_SKIP_AUTH: "true"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  k8s-e2e:
    name: K8s E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 🐳 Build and push Docker image to local registry
        run: |
          docker build -t wedding-app:test .
      - name: 🚀 Create KSail cluster
        uses: devantler-tech/ksail/.github/actions/ksail-cluster@94a23e858044430b94d3775cc71f2600f130380c # v7.15.2
        with:
          distribution: VCluster
          provider: Docker
          init: "false"
          delete: "false"
          ksail-version: "7.15.2"
      - name: 🔧 Configure local registry in containerd
        run: |
          CONTAINER="vcluster.cp.wedding-app"
          REGISTRY="wedding-app-local-registry:5000"
          docker exec "$CONTAINER" sed -i 's/config_path = ""/config_path = "\/etc\/containerd\/certs.d"/' /etc/containerd/config.toml
          docker exec "$CONTAINER" sh -c "mkdir -p /etc/containerd/certs.d/$REGISTRY && cat > /etc/containerd/certs.d/$REGISTRY/hosts.toml <<EOF
          server = \"http://$REGISTRY\"

          [host.\"http://$REGISTRY\"]
            capabilities = [\"pull\", \"resolve\"]
          EOF"
          docker exec "$CONTAINER" systemctl restart containerd
      - name: 📦 Push image and apply manifests
        run: |
          docker tag wedding-app:test localhost:5050/wedding-app:test
          docker push localhost:5050/wedding-app:test
          kubectl apply -k k8s/
      - name: ⏳ Wait for pods
        run: |
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=postgres --timeout=120s
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=wedding-app --timeout=120s
      - name: 🔗 Port-forward
        run: |
          kubectl port-forward svc/wedding-app 3000:80 &
          timeout 60 bash -c 'until curl -sf http://localhost:3000/login > /dev/null 2>&1; do sleep 2; done'
      - name: 🧪 Run E2E tests
        run: npm run test:e2e
        env:
          K8S_E2E: "true"
      - name: 🧹 Delete cluster
        if: always()
        run: ksail cluster delete --force || true

  ci-required-checks:
    name: CI - Required Checks
    runs-on: ubuntu-latest
    needs: [lint, check, test, e2e, build, k8s-e2e]
    permissions: {}
    if: ${{ always() }}
    steps:
      - name: 📊 Require all CI checks to pass
        uses: devantler-tech/actions/aggregate-job-checks@59d3ffbe1a9437fcc39e2794fa2f221abe878310 # v3.3.0
        with:
          job-results: >-
            ${{ needs.lint.result }}
            ${{ needs.check.result }}
            ${{ needs.test.result }}
            ${{ needs.e2e.result }}
            ${{ needs.build.result }}
            ${{ needs.k8s-e2e.result }}
