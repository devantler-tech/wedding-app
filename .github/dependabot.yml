version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Runtime `dependencies` update as `build(deps)` and release a patch (`.releaserc`).
    # adapter-node bundles the devDependencies the app imports into the server build, so updates to
    # those reach guests too, yet arrive as `build(deps-dev)`, which releases nothing on its own.
    # `.releaserc` cuts a patch release for a `build(deps-dev)` commit only when its title names the
    # `site-bundle` group below; tooling updates stay plain `build(deps-dev)` and do not release.
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      # The devDependencies bundled into the server build. Exact names only: a new bundled package
      # must be added here on purpose, and `scripts/release-classification.test.sh` fails until every
      # devDependency is classified as bundled (here) or tooling (in that test).
      site-bundle:
        patterns:
          - "@fontsource/cormorant-garamond"
          - "@fontsource/inter"
          - "@fontsource/pinyon-script"
          - "@fortawesome/free-solid-svg-icons"
          - "@sveltejs/enhanced-img"
          - "@sveltejs/kit"
          - "@sveltejs/vite-plugin-svelte"
          - "@tailwindcss/vite"
          - "cookie"
          - "svelte"
          - "tailwindcss"
          - "vite"
      # A group applies to version updates or security updates, never both, so this second group
      # carries the same packages for security updates. `.releaserc` matches both names, and the
      # test keeps the two lists identical.
      site-bundle-security:
        applies-to: security-updates
        patterns:
          - "@fontsource/cormorant-garamond"
          - "@fontsource/inter"
          - "@fontsource/pinyon-script"
          - "@fortawesome/free-solid-svg-icons"
          - "@sveltejs/enhanced-img"
          - "@sveltejs/kit"
          - "@sveltejs/vite-plugin-svelte"
          - "@tailwindcss/vite"
          - "cookie"
          - "svelte"
          - "tailwindcss"
          - "vite"
    cooldown:
      default-days: 7
    ignore:
      # 5.5.5 restructured the adapter output into a pre-bundled chunk whose
      # top-level `await server.init(...)` never settles in our built app
      # (Node exits 13 before binding the port — every pod CrashLoopBackOffs;
      # took prod down for v1.14.1). Pinned to 5.5.4 in package.json; lift this
      # ignore once a fixed release boots (verify: build + `node build/index.js`
      # answers /login — the Lighthouse lane serves the adapter build again and
      # is the CI canary for exactly this).
      - dependency-name: "@sveltejs/adapter-node"
        versions: ["5.5.5"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # The base image is what the server is built with and runs on, so its updates release:
    # `.releaserc` cuts a patch release for `build(deps)` commits.
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # `.releaserc` cuts a patch release for `build(deps)` commits, which is how runtime packages
    # and the base image reach the live site. Workflow updates change nothing the site serves, so
    # they use the `ci` prefix and release nothing.
    commit-message:
      prefix: "ci"
      include: "scope"
    cooldown:
      default-days: 7
      # devantler-tech actions/workflows are our own code — bump now, no cooldown.
      exclude:
        - "devantler-tech/*"
    # The three devantler-tech/actions reusable-workflow callers (cd, release, template-sync) must
    # pin one shared commit, which scripts/workflow-caller-pin-contract.test.sh enforces as a
    # required check. Ungrouped, Dependabot opens one PR per caller, so each PR advances a single
    # caller and fails that check — #307, #308 and #310 all stalled this way. Grouping them makes a
    # version update arrive as one PR that moves the fleet together.
    groups:
      devantler-tech-actions:
        patterns:
          - "devantler-tech/*"
