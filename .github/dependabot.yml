version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    ignore:
      # 5.5.5 restructured the adapter output into a pre-bundled chunk whose
      # top-level `await server.init(...)` never settles in our built app
      # (Node exits 13 before binding the port — every pod CrashLoopBackOffs;
      # took prod down for v1.14.1). Pinned to 5.5.4 in package.json; lift this
      # ignore once a fixed release boots (verify: build + `node build/index.js`
      # answers /login — the Lighthouse lane serves the adapter build again and
      # is the CI canary for exactly this).
      - dependency-name: "@sveltejs/adapter-node"
        versions: ["5.5.5"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      # devantler-tech actions/workflows are our own code — bump now, no cooldown.
      exclude:
        - "devantler-tech/*"
    # The three devantler-tech/actions reusable-workflow callers (cd, release, template-sync) must
    # pin one shared commit, which scripts/workflow-caller-pin-contract.test.sh enforces as a
    # required check. Ungrouped, Dependabot opens one PR per caller, so each PR advances a single
    # caller and fails that check — #307, #308 and #310 all stalled this way. Grouping them makes a
    # version update arrive as one PR that moves the fleet together.
    groups:
      devantler-tech-actions:
        patterns:
          - "devantler-tech/*"
