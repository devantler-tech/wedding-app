apiVersion: apps/v1
kind: Deployment
metadata:
  name: wedding-app
  labels:
    app.kubernetes.io/name: wedding-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: wedding-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wedding-app
    spec:
      containers:
        - name: wedding-app
          image: ghcr.io/devantler-tech/wedding-app:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
