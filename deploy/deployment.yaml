apiVersion: apps/v1
kind: Deployment
metadata:
  name: wedding-app
  labels:
    app.kubernetes.io/name: wedding-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: wedding-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      # Allow the rollout to retire an old replica instead of being forced to
      # surge an extra pod onto a possibly-unschedulable or cold (cache-less)
      # node. With maxUnavailable: 0 a surge pod that cannot be scheduled or
      # cannot pull the (private) image wedges the whole rollout. Trade-off: a
      # brief 1/2-replica window during deploys, acceptable for this service.
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wedding-app
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: wedding-app
      containers:
        - name: wedding-app
          image: ghcr.io/devantler-tech/wedding-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wedding-db-app
                  key: uri
            - name: ADMIN_CODE
              valueFrom:
                secretKeyRef:
                  name: wedding-app-admin-code
                  key: ADMIN_CODE
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          # Gate liveness/readiness behind a startup probe so a slow cold start
          # (e.g. constrained CPU after a VPA resize, or first request compiling
          # the route) is not killed by the liveness probe mid-boot. Liveness and
          # readiness only begin once startup succeeds. ~60s budget (30 x 2s).
          startupProbe:
            httpGet:
              path: /login
              port: 3000
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
