# Daily base backup of wedding-db to R2 via the cluster's barmanObjectStore
# (cluster.yaml). Combined with the continuous WAL archiving that
# barmanObjectStore auto-enables, this gives point-in-time recovery within the
# 30d retention window. `immediate: true` seeds the first backup as soon as the
# cluster has a primary, so it is never left backup-less waiting for the first
# 03:00 tick. (Namespace comes from the tenant Kustomization's targetNamespace,
# matching cluster.yaml.)
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: wedding-db-daily
spec:
  # CNPG cron is 6-field (seconds first): 03:00 UTC daily.
  schedule: "0 0 3 * * *"
  immediate: true
  backupOwnerReference: self
  method: barmanObjectStore
  cluster:
    name: wedding-db
