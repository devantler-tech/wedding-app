apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: wedding-db
  labels:
    app.kubernetes.io/name: wedding-db
    app.kubernetes.io/part-of: wedding-app
spec:
  instances: 1
  storage:
    size: 1Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: wedding
      owner: wedding
      secret:
        name: wedding-db-credentials
  postgresql:
    parameters:
      max_connections: "50"
      shared_buffers: "64MB"
