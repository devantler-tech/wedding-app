# Namespaced SecretStore for this tenant's OpenBao-backed secrets (read by
# admin-code-externalsecret.yaml). Tenant-owned — the tenant's `edit`
# RoleBinding aggregates `external-secrets-tenant-edit`, so the tenant SA may
# create its own SecretStore.
#
# Authenticates as the tenant's own `wedding-app` ServiceAccount via the
# dedicated `wedding-app` OpenBao Kubernetes auth role, which the platform
# scopes (in vault-config) to read + seed-write under
# secret/{data,metadata}/apps/wedding-app/* only — so this store can never reach
# infra or another tenant's secrets, and the confinement stays platform-enforced
# regardless of who owns this resource. Must be a namespaced SecretStore (never
# the shared `openbao` ClusterSecretStore — the `restrict-tenant-secret-stores`
# Kyverno policy blocks that).
#
# Note: the platform still seeds the shared R2 backup credential
# (`wedding-db-backup-r2`) via its own flux-system ExternalSecret from the infra
# path — that one is NOT a tenant secret and stays platform-side.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: wedding-app
  labels:
    app.kubernetes.io/name: app
spec:
  provider:
    vault:
      # openbao-active = unsealed Raft leader only; the plain `openbao` Service
      # also round-robins onto sealed-but-Ready standbys (503 "Vault is sealed").
      server: "http://openbao-active.openbao.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "wedding-app"
          serviceAccountRef:
            name: "wedding-app"
