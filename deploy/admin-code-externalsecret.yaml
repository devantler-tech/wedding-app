# wedding-app admin login code, sourced from OpenBao via the platform-provisioned
# namespaced SecretStore (`openbao`, kind: SecretStore) instead of an in-artifact
# SOPS secret. The platform seeds the value at apps/wedding-app/admin-code (its
# vault-seed `seed-wedding-app-admin-code` PushSecret); this ExternalSecret reads
# it through the tenant-scoped `wedding-app` Vault role — confined to
# apps/wedding-app/* — and materialises the `wedding-app-admin-code` Secret the
# Deployment consumes (ADMIN_CODE via secretKeyRef). No SOPS, no ClusterSecretStore.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wedding-app-admin-code
  namespace: wedding-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: wedding-app-admin-code
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_CODE
      remoteRef:
        key: apps/wedding-app/admin-code
        property: ADMIN_CODE
