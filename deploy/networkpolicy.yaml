# Tenant-owned allow-list for wedding-app, layered on top of the platform's
# default-deny floor (the platform's `add-default-deny` Kyverno policy generates
# a deny-all + allow-dns CiliumNetworkPolicy in this namespace; this re-opens
# only what the app + its CloudNativePG database need). Owned here in the tenant
# repo so a new egress never requires a platform change — applied by the
# tenant's own Flux Kustomization, which the platform's `cilium-tenant-edit`
# ClusterRole permits.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: app
  namespace: wedding-app
  labels:
    app.kubernetes.io/name: app
spec:
  endpointSelector: {}
  ingress:
    # Gateway ingress
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Intra-namespace (app → db, db replication)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: wedding-app
    # CNPG operator needs to reach DB status endpoint (port 8000)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "5432"
              protocol: TCP
    # Coroot cluster-agent (observability) scrapes the wedding-db Postgres on
    # 5432 for database monitoring — the cluster.yaml inheritedMetadata stamps the
    # coroot.com/postgres-scrape annotations onto the DB Pods. Mutual auth is
    # enforced automatically by the platform's cluster-wide require-mutual-auth
    # policy (both ends carry SPIRE identities), so no authentication stanza is
    # needed here, matching the cnpg-system rule above.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
  egress:
    # Intra-namespace (app → db)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: wedding-app
    # CNPG → Cloudflare R2 (S3) for barman-cloud WAL archiving + base backups
    # (the wedding-db CloudNativePG cluster). Pinned by FQDN instead of
    # world:443 so a compromised pod cannot exfiltrate to arbitrary external
    # services; the R2 pattern matches any account host without committing the
    # account id.
    - toFQDNs:
        - matchPattern: "*.r2.cloudflarestorage.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Kube API (for CNPG operator managing the cluster)
    - toEntities:
        - kube-apiserver
    # DNS resolution. rules.dns engages Cilium's L7 DNS proxy so the toFQDNs
    # allow-list above can be enforced; matchPattern "*" leaves resolution
    # itself unrestricted (the FQDN list constrains where traffic may go).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
